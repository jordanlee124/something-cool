<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ember Vale</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one phone-width column. Age + stores on top, the living map, then a read-only drawer (People / Works / Chronicle). */
:root {
  --bg: #e4e9dc;
  --panel: #f4f6ee;
  --ink: #1e281b;
  --muted: #5a6853;
  --line: #c6cfba;
  --accent: #a8641a;
  --accent-ink: #ffffff;
  --good: #3a7535;
  --bad: #a83526;
  --shade: rgba(20, 28, 18, 0.55);
  --f-display: "Young Serif", Georgia, "Times New Roman", serif;
  --f-body: "Figtree", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12170f; --panel: #1b2218; --ink: #e5ebdb; --muted: #97a58e; --line: #2e3929;
    --accent: #e3a246; --accent-ink: #1b1206; --good: #7dbb72; --bad: #e46b58; --shade: rgba(0,0,0,0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12170f; --panel: #1b2218; --ink: #e5ebdb; --muted: #97a58e; --line: #2e3929;
  --accent: #e3a246; --accent-ink: #1b1206; --good: #7dbb72; --bad: #e46b58; --shade: rgba(0,0,0,0.6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px 28px;
  touch-action: manipulation; -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
header { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.title { min-width: 0; }
.eyebrow { font-size: 0.72rem; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
h1 { font-family: var(--f-display); font-weight: 400; font-size: 1.7rem; margin: 2px 0 0; line-height: 1.05; }
h1 span { color: var(--accent); }
.clock { font-size: 0.8rem; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; margin-top: 4px; }
.clock b { color: var(--ink); font-weight: 700; }
.speed { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.speed button { background: var(--panel); color: var(--ink); border: 0; font: 600 0.85rem var(--f-body); padding: 9px 10px; min-width: 44px; cursor: pointer; }
.speed button + button { border-left: 1px solid var(--line); }
.speed button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.ages { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 3px; }
.age { height: 6px; border-radius: 3px; background: var(--line); position: relative; overflow: hidden; }
.age i { position: absolute; inset: 0 auto 0 0; background: var(--accent); }
.agenote { font-size: 0.8rem; color: var(--muted); margin-top: 5px; }
.agenote b { color: var(--ink); }

.stores { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.store { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 7px 8px; min-width: 0; }
.store .k { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); display: flex; align-items: center; gap: 5px; }
.store .k i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.store .v { font-family: var(--f-mono); font-size: 1rem; font-variant-numeric: tabular-nums; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.store .v small { color: var(--muted); font-size: 0.7rem; }
.store .n { font-size: 0.68rem; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.store.low .v, .store.low .n { color: var(--bad); }

.mapbox { position: relative; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: #6da35a; }
canvas { display: block; width: 100%; touch-action: manipulation; cursor: pointer; }
.info { font-size: 0.85rem; color: var(--muted); min-height: 1.3em; padding: 0 2px; }
.info b { color: var(--ink); }
.toast { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); max-width: calc(100% - 20px);
  background: var(--panel); color: var(--ink); border-radius: 10px; padding: 8px 12px; font-size: 0.85rem; box-shadow: 0 4px 16px rgba(0,0,0,.3); text-align: center; }
.toast.bad { border-left: 4px solid var(--bad); }
.toast.good { border-left: 4px solid var(--good); }
.banner { position: absolute; left: 0; right: 0; top: 38%; text-align: center; pointer-events: none; padding: 14px 10px;
  background: linear-gradient(90deg, transparent, rgba(20,16,8,.72) 18%, rgba(20,16,8,.72) 82%, transparent); color: #f6e7c4; }
.banner small { display: block; font: 600 0.72rem var(--f-body); letter-spacing: 0.16em; text-transform: uppercase; color: #e3b25a; }
.banner strong { display: block; font: 400 2rem var(--f-display); margin-top: 2px; }

.drawer { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--line); }
.tabs button { background: transparent; border: 0; color: var(--muted); font: 600 0.9rem var(--f-body); padding: 12px 6px; cursor: pointer; }
.tabs button[aria-selected="true"] { color: var(--ink); box-shadow: inset 0 -3px 0 var(--accent); }
.pane { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.steward { font-size: 0.85rem; color: var(--muted); line-height: 1.4; }
.steward b { color: var(--ink); }

.job { display: grid; grid-template-columns: 12px 92px minmax(0, 1fr) 36px; align-items: center; gap: 8px; }
.job .dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid rgba(0,0,0,.35); }
.job .name { font-weight: 600; font-size: 0.9rem; }
.job .bar { height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; }
.job .bar i { display: block; height: 100%; border-radius: 4px; }
.job output { font-family: var(--f-mono); text-align: right; font-variant-numeric: tabular-nums; }

.sites { display: flex; flex-direction: column; gap: 8px; }
.site { display: grid; grid-template-columns: minmax(0, 1fr) 90px 38px; gap: 8px; align-items: center; font-size: 0.85rem; }
.site .bar { height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; }
.site .bar i { display: block; height: 100%; background: var(--accent); }
.site span:last-child { font-family: var(--f-mono); font-size: 0.75rem; color: var(--muted); text-align: right; }
.counts { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px; }
.count { font-size: 0.8rem; color: var(--muted); display: flex; justify-content: space-between; border-bottom: 1px dashed var(--line); padding-bottom: 3px; }
.count b { font-family: var(--f-mono); color: var(--ink); }
.town { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto auto; gap: 8px; align-items: center; font-size: 0.85rem;
  width: 100%; text-align: left; background: transparent; border: 0; border-radius: 8px; padding: 6px 6px; color: var(--ink); font-family: var(--f-body); cursor: pointer; }
.town[aria-pressed="true"] { background: var(--bg); box-shadow: inset 0 0 0 1px var(--accent); }
.realmhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.showall { background: transparent; color: var(--accent); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; font: 600 0.78rem var(--f-body); cursor: pointer; }
.chip.camp { color: #f0f0f0; background: #3a1a14; border-color: #3a1a14; }
.chip.home { color: var(--accent); }
.town .flag { width: 10px; height: 14px; border-radius: 2px; }
.town .tp { font-family: var(--f-mono); font-size: 0.78rem; color: var(--muted); }
.chip { font-size: 0.7rem; font-weight: 700; border-radius: 999px; padding: 2px 8px; border: 1px solid currentColor; }
.chip.ally { color: #3d7fd1; } .chip.neutral { color: var(--muted); } .chip.enemy { color: var(--bad); }
.sub { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }

.miles { display: flex; flex-wrap: wrap; gap: 6px; }
.mile { font-size: 0.75rem; border: 1px dashed var(--line); border-radius: 999px; padding: 4px 9px; color: var(--muted); }
.mile.done { border: 1px solid var(--good); color: var(--good); font-weight: 600; }
.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; max-height: 320px; overflow-y: auto; }
.log li { font-size: 0.85rem; line-height: 1.35; display: grid; grid-template-columns: 58px minmax(0,1fr); gap: 6px; }
.log li span { font-family: var(--f-mono); font-size: 0.72rem; color: var(--muted); padding-top: 2px; }
.log li.bad { color: var(--bad); }
.log li.good { color: var(--good); }
.log li.age { color: var(--accent); font-weight: 700; }
.reset { align-self: flex-start; background: transparent; color: var(--muted); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font: 600 0.8rem var(--f-body); cursor: pointer; }
.reset.arm { color: var(--bad); border-color: var(--bad); }

.modal { position: fixed; inset: 0; background: var(--shade); display: flex; align-items: flex-end; justify-content: center; z-index: 20;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet { background: var(--panel); color: var(--ink); border-radius: 16px; padding: 18px; width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 10px 40px rgba(0,0,0,.35); }
.sheet h2 { font-family: var(--f-display); font-weight: 400; font-size: 1.35rem; margin: 0; text-wrap: balance; }
.sheet p { margin: 0; color: var(--muted); line-height: 1.45; }
.sheet button { padding: 12px 14px; border-radius: 10px; border: 0; background: var(--accent); color: var(--accent-ink); font: 600 0.92rem var(--f-body); cursor: pointer; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="title">
      <div class="eyebrow">Ember Vale</div>
      <h1 id="agename">The <span>Settlement</span></h1>
      <div class="clock" id="clock">Year 1 · Spring · Day 1</div>
    </div>
    <div class="speed" role="group" aria-label="Game speed">
      <button id="sp0" aria-pressed="false">Pause</button>
      <button id="sp1" aria-pressed="false">1×</button>
      <button id="sp3" aria-pressed="true">3×</button>
      <button id="sp10" aria-pressed="false">10×</button>
    </div>
  </header>
  <div>
    <div class="ages" id="ages"></div>
    <div class="agenote" id="agenote"></div>
  </div>

  <div class="stores">
    <div class="store" id="st-food"><div class="k"><i style="background:#e3c14b"></i>Food</div><div class="v"></div><div class="n"></div></div>
    <div class="store" id="st-wood"><div class="k"><i style="background:#8b5a2b"></i>Wood</div><div class="v"></div><div class="n"></div></div>
    <div class="store" id="st-stone"><div class="k"><i style="background:#9aa4ad"></i>Stone</div><div class="v"></div><div class="n"></div></div>
    <div class="store" id="st-pop"><div class="k"><i style="background:#e07b39;border-radius:50%"></i>People</div><div class="v"></div><div class="n"></div></div>
  </div>

  <div class="mapbox" id="mapbox">
    <canvas id="map" aria-label="The colony map. Tap anywhere to inspect a colonist, building or tile."></canvas>
    <div class="toast" id="toast" hidden></div>
    <div class="banner" id="banner" hidden><small id="bansmall">A new age</small><strong id="banbig"></strong></div>
  </div>
  <div class="info" id="info">The colony runs itself. Tap the map to inspect a colonist, building or tile.</div>

  <div class="drawer">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-people" aria-selected="true">People</button>
      <button role="tab" id="tab-works" aria-selected="false">Works</button>
      <button role="tab" id="tab-log" aria-selected="false">Chronicle</button>
    </div>
    <div class="pane" id="pane-people">
      <div class="steward" id="steward"></div>
      <div id="jobs"></div>
      <div class="realmhead"><span class="sub">Realm · tap to zoom</span><button class="showall" id="showall" hidden>Show all</button></div>
      <div class="sites" id="towns"></div>
    </div>
    <div class="pane" id="pane-works" hidden>
      <div class="sub">Under construction</div>
      <div class="sites" id="sites"></div>
      <div class="sub">Standing</div>
      <div class="counts" id="counts"></div>
    </div>
    <div class="pane" id="pane-log" hidden>
      <div class="miles" id="miles"></div>
      <ul class="log" id="log"></ul>
      <button class="reset" id="reset">Found a new colony</button>
    </div>
  </div>
</div>

<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mt">
    <h2 id="mt"></h2>
    <p id="mx"></p>
    <button id="mbtn">Found a new colony</button>
  </div>
</div>

<script>
(() => {
'use strict';
const W = 32, H = 40, DAY = 12, SEASON_DAYS = 8, YEAR = 32, SPEED = 2.1, TP = 28;
const SEASONS = ['Spring', 'Summer', 'Autumn', 'Winter'];
const KEY = 'ember-vale-save-v2';
const JOBS = {
  farmer:     { label: 'Farmers',     color: '#e3c14b' },
  woodcutter: { label: 'Woodcutters', color: '#8b5a2b' },
  miner:      { label: 'Miners',      color: '#aab3bb' },
  builder:    { label: 'Builders',    color: '#e07b39' },
};
const AGES = [
  { name: 'Settlement', pop: 0 },
  { name: 'Village', pop: 12, mark: 'chapel' },
  { name: 'Town', pop: 30, mark: 'market' },
  { name: 'City', pop: 60, mark: 'cathedral' },
  { name: 'Kingdom', pop: 110, mark: 'castle' },
  { name: 'Empire', pop: 180, mark: 'palace' },
];
const BUILD = {
  tc:        { name: 'Town center', cost: {}, time: 1, house: 5 },
  hut:       { name: 'Hut',        cost: { wood: 12 },               time: 8,  house: 3 },
  house:     { name: 'House',      cost: { wood: 16, stone: 10 },    time: 10, house: 6,  from: 'hut',   age: 2 },
  manor:     { name: 'Townhouse',  cost: { wood: 20, stone: 26 },    time: 14, house: 10, from: 'house', age: 3 },
  farm:      { name: 'Farm',       cost: { wood: 8 },                time: 6,  slots: 2 },
  dock:      { name: 'Fishing dock', cost: { wood: 14, stone: 2 },   time: 8,  slots: 1 },
  store:     { name: 'Storehouse', cost: { wood: 15, stone: 6 },     time: 10 },
  tower:     { name: 'Watchtower', cost: { wood: 10, stone: 16 },    time: 12, def: 4 },
  barracks:  { name: 'Barracks',   cost: { wood: 30, stone: 40 },    time: 18, def: 12, age: 3 },
  chapel:    { name: 'Chapel',     cost: { wood: 30, stone: 15 },    time: 16, mark: 1 },
  market:    { name: 'Market',     cost: { wood: 40, stone: 30 },    time: 18, mark: 2 },
  cathedral: { name: 'Cathedral',  cost: { wood: 60, stone: 90 },    time: 30, mark: 3 },
  castle:    { name: 'Castle',     cost: { wood: 80, stone: 150 },   time: 40, def: 25, mark: 4 },
  palace:    { name: 'Palace',     cost: { wood: 120, stone: 220 },  time: 60, mark: 5 },
};
const HOUSING = ['tc', 'hut', 'house', 'manor'];
const TOWN_NAMES = ['Ashford','Brackenhold','Corrowmere','Dunhallow','Eastwick','Fallowmere','Greywater','Hollowell','Ironbrook','Kestrel Hill','Larkspur','Millhaven','Northcombe','Oakhurst','Ravensby','Stonebridge','Thornbury','Wyndham'];
const STANCE = { ally: { label: 'Allied', color: '#3d7fd1' }, neutral: { label: 'Neutral', color: '#efe9d8' }, enemy: { label: 'Hostile', color: '#d33a2c' } };
const LANDMARKS = ['chapel', 'market', 'cathedral', 'castle', 'palace'];
const CAMP_NAMES = ['Red Hand', 'Wolf Clan', 'Ash Riders', 'Black Fang', 'Bone Hill', 'Iron Crows', 'Grey Marauders', 'Night Howlers', 'Skull Ford'];
const NAMES = ['Ada','Bram','Cora','Dain','Edda','Finn','Greta','Hale','Ines','Jory','Kit','Lena','Milo','Nell','Orrin','Pia','Quill','Rhea','Sten','Tova','Ulric','Vera','Wren','Yara','Zane','Ash','Bo','Cass','Dov','Elin','Fern','Gil','Hedy','Ivo','Juno','Lark','Moss','Nico','Oona','Pell','Rook','Sage','Tam','Ula','Wynn','Brin','Corra','Ebb','Hollis','Mara','Alder','Bryn','Calla','Dara','Esme','Fen','Garr','Holt','Isla','Jem','Kael','Liesl','Mira','Noor','Odo','Petra','Rowan','Sol','Thea','Ulla','Vik','Willa','Yves','Zora'];
const MILES = [
  { id: 'winter', t: 'First winter survived', ok: () => s.day > YEAR },
  { id: 'p50',    t: '50 people',  ok: () => s.cols.length >= 50 },
  { id: 'p100',   t: '100 people', ok: () => s.cols.length >= 100 },
  { id: 'p200',   t: '200 people', ok: () => s.cols.length >= 200 },
  { id: 'y5',     t: 'Year five',  ok: () => year() >= 5 },
  { id: 'y10',    t: 'Year ten',   ok: () => year() >= 10 },
];

const $ = id => document.getElementById(id);
const rnd = Math.random;
const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
const pick = a => a[Math.floor(rnd() * a.length)];
const N4 = [[1,0],[-1,0],[0,1],[0,-1]];
let s = null;
const ui = { tab: 'people', sel: null, toastT: 0, bannerT: 0 };
let floaters = [];
let terrDirty = true, logDirty = true;

// ---------- world helpers ----------
const tile = (x, y) => (x < 0 || y < 0 || x >= W || y >= H) ? null : s.tiles[y * W + x];
const year = () => Math.floor((s.day - 1) / YEAR) + 1;
const season = () => Math.floor(((s.day - 1) % YEAR) / SEASON_DAYS);
const dayOfSeason = () => ((s.day - 1) % SEASON_DAYS) + 1;
const byId = id => s.buildings.find(b => b.id === id);
const tc = () => s.buildings.find(b => b.type === 'tc');
const builtCount = type => s.buildings.filter(b => b.type === type && b.built).length;
const anyCount = type => s.buildings.filter(b => b.type === type).length;
const houseOf = b => b.built ? (BUILD[b.type].house || 0) : (b.from ? BUILD[b.from].house || 0 : 0);
const housing = () => s.buildings.reduce((n, b) => n + houseOf(b), 0);
const futureHousing = () => s.buildings.reduce((n, b) => n + (BUILD[b.type].house || 0), 0);
const cap = () => 100 + 100 * builtCount('store') + 50 * s.age;
const drops = () => s.buildings.filter(b => b.built && (b.type === 'tc' || b.type === 'store'));
const defense = () => s.buildings.reduce((n, b) => n + (b.built ? BUILD[b.type].def || 0 : 0), 0) + Math.floor(s.cols.length / 6) + allyHelp();
const live = () => s.towns.filter(n => !n.gone);
const camps = () => s.camps.filter(c => !c.gone);
const campThreat = () => camps().reduce((m, c) => Math.max(m, Math.floor(c.str)), 0);
const allyHelp = () => live().reduce((n, t) => n + (t.stance === 'ally' ? Math.floor(t.pop / 4) : 0), 0);
const townById = id => s.towns.find(n => n.id === id);
const stanceOf = rel => rel >= 35 ? 'ally' : rel <= -35 ? 'enemy' : 'neutral';
const moodLabel = m => m >= 75 ? 'joyful' : m >= 60 ? 'content' : m >= 45 ? 'uneasy' : m >= 30 ? 'restless' : 'mutinous';
const raidStrength = () => 2 + Math.floor(year() * 1.5) + Math.floor(s.cols.length / 5);
const afford = cost => Object.entries(cost).every(([k, v]) => s.res[k] >= v);
const pay = cost => { for (const [k, v] of Object.entries(cost)) s.res[k] -= v; };

function vnoise(gw, gh) {
  const g = Array.from({ length: gw * gh }, rnd);
  return (x, y) => {
    const fx = x / (W - 1) * (gw - 1), fy = y / (H - 1) * (gh - 1);
    const x0 = Math.min(Math.floor(fx), gw - 2), y0 = Math.min(Math.floor(fy), gh - 2), tx = fx - x0, ty = fy - y0;
    const a = g[y0 * gw + x0], b = g[y0 * gw + x0 + 1], c = g[(y0 + 1) * gw + x0], d = g[(y0 + 1) * gw + x0 + 1];
    return (a * (1 - tx) + b * tx) * (1 - ty) + (c * (1 - tx) + d * tx) * ty;
  };
}

function genMap(cx, cy) {
  const fN = vnoise(8, 10), rN = vnoise(7, 9), tiles = [];
  const lakes = [
    { x: rnd() < 0.5 ? ri(3, 7) : ri(W - 8, W - 4), y: ri(6, H - 7), rx: 3.2, ry: 4.2 },
    { x: ri(4, W - 5), y: rnd() < 0.5 ? ri(3, 7) : ri(H - 8, H - 4), rx: 2.2, ry: 1.8 },
  ];
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {

  ctx.restore();
  const bl = n.bl.slice().sort((a, b) => a.y - b.y);
  for (const b of bl) drawBuilding(ctx, { x: b.x, y: b.y, type: b.type === 'hall' ? 'hut' : b.type, built: true });
  // banner over the hall
  ctx.strokeStyle = '#3a2618'; ctx.lineWidth = 0.05;
  ctx.beginPath(); ctx.moveTo(n.x + 0.5, n.y + 0.2); ctx.lineTo(n.x + 0.5, n.y - 0.55); ctx.stroke();
  ctx.fillStyle = n.flag; ctx.fillRect(n.x + 0.52, n.y - 0.55, 0.38, 0.26);
  ctx.strokeStyle = col; ctx.lineWidth = 0.05; ctx.strokeRect(n.x + 0.52, n.y - 0.55, 0.38, 0.26);
  drawWalkers(n.id, n.x, n.y, Math.min(n.pop, 10), n.flag, '#1f1a14', 2.8, rdt);
}
function camTarget() {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const b of s.buildings) { x0 = Math.min(x0, b.x); y0 = Math.min(y0, b.y); x1 = Math.max(x1, b.x + 1); y1 = Math.max(y1, b.y + 1); }
  for (const n of live().concat(camps())) { x0 = Math.min(x0, n.x - 3); y0 = Math.min(y0, n.y - 3); x1 = Math.max(x1, n.x + 4); y1 = Math.max(y1, n.y + 4); }
  const f = focusTarget();
  if (f) { x0 = f.x - 5; x1 = f.x + 6; y0 = f.y - 6; y1 = f.y + 7; }
  const m = f ? 0 : 3;
  x0 -= m; y0 -= m; x1 += m; y1 += m;
  let w = Math.max(12, x1 - x0), h = Math.max(15, y1 - y0);
  if (w / h > W / H) h = w * H / W; else w = h * W / H;
  w = Math.min(W, w); h = Math.min(H, h);
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  return { x: Math.max(0, Math.min(W - w, cx - w / 2)), y: Math.max(0, Math.min(H - h, cy - h / 2)), w, h };
}

function draw(rdt) {
  if (terrDirty) drawTerrain();
  const tg = camTarget();
  if (!cam) cam = { ...tg };
  const a = Math.min(1, rdt * 1.2);
  for (const k of ['x', 'y', 'w', 'h']) cam[k] += (tg[k] - cam[k]) * a;
  const k = cv.width / cam.w; // device px per tile
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#6da35a'; ctx.fillRect(0, 0, cv.width, cv.height);
  const sp = TP * tdpr;
  ctx.drawImage(terr, cam.x * sp, cam.y * sp, cam.w * sp, cam.h * sp, 0, 0, cv.width, cv.height);
  ctx.setTransform(k, 0, 0, k, -cam.x * k, -cam.y * k);
  const sorted = s.buildings.slice().sort((p, q) => p.y - q.y);
  for (const b of sorted) drawBuilding(ctx, b);
  for (const n of live()) drawTown(n, rdt);
  for (const c of camps()) drawCamp(c, rdt);
  const rad = Math.max(0.14, 2.4 * dpr / k);
  for (const c of s.cols) {
    const ox = (((c.id * 37) % 7) - 3) * 0.045, oy = (((c.id * 53) % 5) - 2) * 0.045;
    const bob = c.st === 'work' && !reduced ? Math.sin(performance.now() / 120 + c.id) * 0.03 : 0;
    const px = c.x + 0.5 + ox, py = c.y + 0.5 + oy + bob;
    ctx.fillStyle = c.st === 'exodus' ? '#f4f1e6' : JOBS[c.job] ? JOBS[c.job].color : '#f4f1e6';
    ctx.strokeStyle = '#1f1a14'; ctx.lineWidth = rad * 0.35;
    ctx.beginPath(); ctx.arc(px, py, rad, 0, 7); ctx.fill(); ctx.stroke();
    if (c.carry) { ctx.fillStyle = RES_COLOR[c.carry.r]; ctx.fillRect(px - rad * 0.5, py - rad * 2.3, rad, rad * 0.85); }
    if (ui.sel && ui.sel.c === c.id) { ctx.strokeStyle = '#ffffff'; ctx.lineWidth = rad * 0.4; ctx.beginPath(); ctx.arc(px, py, rad * 1.9, 0, 7); ctx.stroke(); }
  }
  if (ui.sel && !ui.sel.c) { ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 0.06; ctx.strokeRect(ui.sel.x + 0.03, ui.sel.y + 0.03, 0.94, 0.94); }
  // floaters, snow and dusk in screen pixels
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const kc = k / dpr;
  ctx.font = `700 ${Math.max(10, Math.min(16, kc * 0.45))}px Figtree, system-ui, sans-serif`; ctx.textAlign = 'center';
  floaters = floaters.filter(f => (f.t += rdt) < 1.2);
  if (kc > 14) for (const f of floaters) {
    const sx = (f.x + 0.5 - cam.x) * kc, sy = (f.y + 0.1 - f.t * 0.8 - cam.y) * kc;
    ctx.globalAlpha = 1 - f.t / 1.2;
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillText(f.text, sx + 1, sy + 1);
    ctx.fillStyle = f.color; ctx.fillText(f.text, sx, sy);
  }
  ctx.globalAlpha = 1;
  drawLabels();
  const cw = cv.width / dpr, ch = cv.height / dpr;
  if (season() === 3 && !reduced) {
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    for (const fl of flakes) {
      fl.y += fl.v * rdt * Math.max(0.3, Math.min(3, s.speed)); fl.x += Math.sin(fl.y * 20) * 0.0008;
      if (fl.y > 1) { fl.y = 0; fl.x = rnd(); }
      ctx.beginPath(); ctx.arc(fl.x * cw, fl.y * ch, fl.s * 1.2, 0, 7); ctx.fill();
    }
  }
  const dayFrac = s.t / DAY;
  const dusk = dayFrac > 0.8 ? (dayFrac - 0.8) / 0.2 : dayFrac < 0.08 ? 1 - dayFrac / 0.08 : 0;
  if (dusk > 0) { ctx.fillStyle = `rgba(20,24,60,${dusk * 0.28})`; ctx.fillRect(0, 0, cw, ch); }
}

// ---------- UI ----------
function toast(text, k) { const t = $('toast'); t.textContent = text; t.className = 'toast ' + (k || ''); t.hidden = false; ui.toastT = 3; }
function banner(name) { $('banbig').textContent = `The ${name}`; $('banner').hidden = false; ui.bannerT = 4; }
function setSpeed(v) {
  if (!s || s.over) return;
  s.speed = v;
  [0, 1, 3, 10].forEach(n => $('sp' + n).setAttribute('aria-pressed', String(n === v)));
}
function setTab(t) {
  ui.tab = t;
  ['people', 'works', 'log'].forEach(n => { $('tab-' + n).setAttribute('aria-selected', String(n === t)); $('pane-' + n).hidden = n !== t; });
  logDirty = true; refreshUI();
}
const STATUS = { farmer: 'tending fields', woodcutter: 'felling trees', miner: 'quarrying stone', builder: 'building' };
function describe(sel) {
  if (sel.c) {
    const c = s.cols.find(o => o.id === sel.c);
    if (!c) return 'The colony runs itself. Tap the map to inspect a colonist, building or tile.';
    const b = byId(c.tid);
    const st = c.st === 'work' ? (c.job === 'farmer' && b && b.type === 'dock' ? 'fishing' : STATUS[c.job])
      : c.st === 'goWork' ? 'heading to work' : c.st === 'goStore' ? `hauling ${c.carry ? c.carry.n + ' ' + c.carry.r : 'goods'}` : c.st === 'wander' ? 'strolling' : 'resting';
    return `<b>${c.name}</b> · ${JOBS[c.job].label.slice(0, -1)} · ${st}${c.hun ? ` · hungry ${c.hun} day${c.hun > 1 ? 's' : ''}` : ''}`;
  }
  const T = tile(sel.x, sel.y);
  if (!T) return '';
  if (T.c) {
    const c = s.camps.find(x => x.id === T.c);
    if (c) return `<b>${c.name}</b> · barbarian camp · strength ${Math.floor(c.str)} against our defense ${defense()}`;
  }
  if (T.o) {
    const n = townById(T.o);
    if (n) return `<b>${n.name}</b> · ${STANCE[n.stance].label.toLowerCase()} · ${n.pop} people · founded day ${n.founded}`;
  }
  if (T.b) {
    const b = byId(T.b), B = BUILD[b.type];
    if (!b.built) return `<b>${B.name}</b> · ${b.from ? 'being rebuilt' : 'under construction'}, ${Math.floor(Math.min(1, b.prog / B.time) * 100)}%`;
    if (B.slots) { const n = s.cols.filter(c => c.job === 'farmer' && c.tid === b.id && (c.st === 'work' || c.st === 'goWork')).length; return `<b>${B.name}</b> · ${n}/${B.slots} at work · yields ${farmYield(b)} a trip`; }
    if (B.house) return `<b>${B.name}</b> · home for ${B.house}`;
    if (B.def) return `<b>${B.name}</b> · adds ${B.def} defense`;
    if (b.type === 'store') return `<b>Storehouse</b> · +100 storage and a drop-off point`;
    if (b.type === 'chapel') return `<b>Chapel</b> · more children are born`;
    if (b.type === 'market') return `<b>Market</b> · trades surplus for what the colony lacks`;
    if (b.type === 'cathedral') return `<b>Cathedral</b> · the pride of the city`;
    if (b.type === 'palace') return `<b>Palace</b> · seat of the empire`;
    return `<b>${B.name}</b>`;
  }
  if (T.t === 1) return `<b>Forest</b> · ${T.amt} wood left`;
  if (T.t === 2) return `<b>Rock</b> · ${T.amt} stone left`;
  if (T.t === 3) return `<b>Lake</b>`;
  if (T.sap) return `<b>Saplings</b> · forest again in ${T.sap} days`;
  if (T.foot > 20) return `<b>${s.age >= 3 && T.foot > 160 ? 'Street' : 'Footpath'}</b> · worn by daily traffic`;
  return `<b>Meadow</b>`;
}
cv.addEventListener('click', e => {
  if (!s || !cam) return;
  const r = cv.getBoundingClientRect(), kc = r.width / cam.w;
  const fx = cam.x + (e.clientX - r.left) / kc, fy = cam.y + (e.clientY - r.top) / kc;
  let best = null, bd = Math.max(0.45, 10 / kc);
  for (const c of s.cols) { const d = Math.hypot(c.x + 0.5 - fx, c.y + 0.5 - fy); if (d < bd) { bd = d; best = c; } }
  ui.sel = best ? { c: best.id } : { x: Math.floor(fx), y: Math.floor(fy) };
  $('info').innerHTML = describe(ui.sel);
});
[0, 1, 3, 10].forEach(n => $('sp' + n).addEventListener('click', () => setSpeed(n)));
$('towns').addEventListener('click', e => {
  const b = e.target.closest('button.town');
  if (!b) return;
  const k = b.dataset.k, id = +b.dataset.id || 0;
  const same = ui.focus && ui.focus.kind === k && (k === 'home' || ui.focus.id === id);
  ui.focus = same ? null : { kind: k, id };
  ui.realmHtml = ''; refreshUI();
  if (!same) $('mapbox').scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'nearest' });
});
$('showall').addEventListener('click', () => { ui.focus = null; ui.realmHtml = ''; refreshUI(); });
['people', 'works', 'log'].forEach(n => $('tab-' + n).addEventListener('click', () => setTab(n)));
let resetArm = 0;
$('reset').addEventListener('click', () => {
  const b = $('reset');
  if (Date.now() - resetArm < 3000) { resetArm = 0; b.classList.remove('arm'); b.textContent = 'Found a new colony'; restart(); return; }
  resetArm = Date.now(); b.classList.add('arm'); b.textContent = 'Tap again to abandon this colony';
  setTimeout(() => { if (resetArm && Date.now() - resetArm >= 3000) { b.classList.remove('arm'); b.textContent = 'Found a new colony'; } }, 3100);
});

function setStore(id, v, note, low) {
  const el = $(id); el.querySelector('.v').innerHTML = v; el.querySelector('.n').textContent = note; el.classList.toggle('low', !!low);
}
function buildStatic() {
  $('ages').innerHTML = AGES.map((a, i) => `<div class="age" title="${a.name}"><i id="age${i}"></i></div>`).join('');
  $('jobs').innerHTML = Object.entries(JOBS).map(([k, j]) =>
    `<div class="job"><span class="dot" style="background:${j.color}"></span><span class="name">${j.label}</span><div class="bar"><i id="bar-${k}" style="background:${j.color}"></i></div><output id="n-${k}">0</output></div>`).join('');
}
function refreshUI() {
  const pop = s.cols.length, se = season(), c = cap();
  $('agename').innerHTML = `The <span>${AGES[s.age].name}</span>`;
  $('clock').innerHTML = `Year <b>${year()}</b> · <b>${SEASONS[se]}</b> · Day ${dayOfSeason()} of ${SEASON_DAYS}`;
  const next = AGES[s.age + 1];
  AGES.forEach((a, i) => {
    let f = i <= s.age ? 1 : 0;
    if (i === s.age + 1) f = Math.min(0.95, pop / a.pop);
    $('age' + i).style.width = (f * 100) + '%';
  });
  if (next) {
    const has = builtCount(next.mark), building = anyCount(next.mark) && !has;
    $('agenote').innerHTML = `Next: <b>${next.name}</b> at ${next.pop} people (${pop} now) and a ${BUILD[next.mark].name.toLowerCase()}${has ? ' ✓' : building ? ' (being built)' : ''}.`;
  } else $('agenote').innerHTML = `<b>The Empire stands.</b> The steward keeps it fed, housed and growing.`;
  setStore('st-food', `${Math.floor(s.res.food)}`, `−${pop}/day`, pop && s.res.food < pop * 3);
  const heat = Math.ceil(pop / 4);
  setStore('st-wood', `${Math.floor(s.res.wood)}`, se === 3 ? `−${heat}/day` : `max ${c}`, se === 3 && s.res.wood < heat * 2);
  setStore('st-stone', `${Math.floor(s.res.stone)}`, `max ${c}`, false);
  const hs = housing();
  setStore('st-pop', `${pop}<small>/${hs}</small>`, `mood ${Math.round(s.mood)}`, s.mood < 40);
  if (ui.tab === 'people') {
    const why = (s.moodWhy || []).join(', ');
    $('steward').innerHTML = `<b>Steward:</b> ${s.steward}<br><b>Mood:</b> ${Math.round(s.mood)}, ${moodLabel(s.mood)}${why ? ` (${why})` : ''}.`;
    const f = ui.focus, on = (k, id) => f && f.kind === k && (k === 'home' || f.id === id) ? 'true' : 'false';
    const rows = [`<button class="town" data-k="home" aria-pressed="${on('home')}"><span class="flag" style="background:#e3a246"></span><span>Ember Vale</span><span class="tp">${pop} people</span><span class="chip home">Capital</span></button>`]
      .concat(live().map(n => `<button class="town" data-k="town" data-id="${n.id}" aria-pressed="${on('town', n.id)}"><span class="flag" style="background:${n.flag}"></span><span>${n.name}</span><span class="tp">${n.pop} people</span><span class="chip ${n.stance}">${STANCE[n.stance].label}</span></button>`))
      .concat(camps().map(c => `<button class="town" data-k="camp" data-id="${c.id}" aria-pressed="${on('camp', c.id)}"><span class="flag" style="background:#16100c"></span><span>${c.name}</span><span class="tp">strength ${Math.floor(c.str)}</span><span class="chip camp">Barbarians</span></button>`));
    const html = rows.join('') + (rows.length === 1 ? '<div class="steward">No other settlements yet. Groups break away now and then, and barbarians arrive from year 2.</div>' : '');
    if (html !== ui.realmHtml) { $('towns').innerHTML = html; ui.realmHtml = html; }
    $('showall').hidden = !ui.focus;
    for (const k of Object.keys(JOBS)) {
      const n = s.cols.filter(o => o.job === k).length;
      $('n-' + k).textContent = n;
      $('bar-' + k).style.width = (pop ? n / pop * 100 : 0) + '%';
    }
  } else if (ui.tab === 'works') {
    const sites = s.buildings.filter(b => !b.built);
    $('sites').innerHTML = sites.length ? sites.map(b => {
      const p = Math.min(1, b.prog / BUILD[b.type].time);
      return `<div class="site"><span>${BUILD[b.type].name}${b.from ? ' (rebuild)' : ''}</span><div class="bar"><i style="width:${p * 100}%"></i></div><span>${Math.floor(p * 100)}%</span></div>`;
    }).join('') : '<div class="steward">Nothing under construction right now.</div>';
    const counts = {};
    for (const b of s.buildings) if (b.built) counts[b.type] = (counts[b.type] || 0) + 1;
    $('counts').innerHTML = Object.keys(BUILD).filter(k => counts[k]).map(k => `<div class="count"><span>${BUILD[k].name}</span><b>${counts[k]}</b></div>`).join('');
  } else if (logDirty) {
    const chips = AGES.slice(1).map((a, i) => `<span class="mile${s.age >= i + 1 ? ' done' : ''}">${a.name}</span>`)
      .concat(MILES.map(m => `<span class="mile${s.miles[m.id] ? ' done' : ''}">${m.t}</span>`));
    $('miles').innerHTML = chips.join('');
    const ul = $('log'); ul.textContent = '';
    for (const e of s.log) {
      const li = document.createElement('li'); if (e.k) li.className = e.k;
      const sp = document.createElement('span'); sp.textContent = 'Day ' + e.d;
      li.appendChild(sp); li.appendChild(document.createTextNode(e.text)); ul.appendChild(li);
    }
    logDirty = false;
  }
  if (ui.sel) $('info').innerHTML = describe(ui.sel);
}

// ---------- loop ----------
function step(dt) {
  s.t += dt;
  s.aiT += dt;
  dropCache = drops();
  for (const c of s.cols.slice()) updC(c, dt);
  if (s.aiT >= 1.5) { s.aiT = 0; stewardJobs(); stewardBuild(); }
  dropCache = null;
  while (s.t >= DAY && !s.over) { s.t -= DAY; daily(); }
}
let last = performance.now(), uiAcc = 0;
function frame(now) {
  const rdt = Math.min(0.1, (now - last) / 1000); last = now;
  if (!s.over && s.speed > 0) {
    // sub-step at high speed so walkers and timers stay accurate
    let dt = rdt * s.speed;
    while (dt > 0) { const d = Math.min(dt, 0.2); step(d); dt -= d; if (s.over) break; }
  }
  draw(rdt);
  if (ui.toastT > 0 && (ui.toastT -= rdt) <= 0) $('toast').hidden = true;
  if (ui.bannerT > 0 && (ui.bannerT -= rdt) <= 0) $('banner').hidden = true;
  if (overTimer > 0 && (overTimer -= rdt) <= 0) restart();
  uiAcc += rdt;
  if (uiAcc > 0.3) { uiAcc = 0; refreshUI(); }
  requestAnimationFrame(frame);
}

function start(data) {
  let loaded = null;
  if (data && data.save) { try { loaded = JSON.parse(data.save); } catch (e) {} }
  s = loaded || load();
  if (!s) newGame();
  if (!s.towns) { s.towns = []; s.mood = 62; s.grief = 0; s.moodWhy = []; }
  if (!s.camps) s.camps = [];
  buildStatic();
  resize();
  setSpeed(s.speed === undefined ? 3 : s.speed);
  refreshUI();
  if (s.over) showOver();
  requestAnimationFrame(t => { last = t; frame(t); });
}
window.addEventListener('resize', resize);
document.addEventListener('visibilitychange', () => { if (document.hidden && s) save(); });
window.claude?.hot?.snapshot?.(() => ({ save: JSON.stringify(s) }));
window.__ev = { get s() { return s; }, step, newGame };
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>

</body>
